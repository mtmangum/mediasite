<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recent Presentations</title>
<style>
  :root { --bg:#fff; --fg:#1b1f23; --muted:#667; --line:#d5d9de; --panel:#f5f6f8; --accent:#0b62d6; --bad:#b42318; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171a; --fg:#e6e8ea; --muted:#9aa3ad; --line:#2d333a; --panel:#1c2024; --accent:#6aa6ff; --bad:#ff7b72; }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; font:14px/1.45 system-ui,sans-serif; background:var(--bg); color:var(--fg); max-width:900px; margin-inline:auto; }
  header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px; }
  h1 { font-size:18px; margin:0; }
  header a { color:var(--accent); }
  .card { display:flex; gap:14px; padding:12px; margin-bottom:10px; border:1px solid var(--line); border-radius:8px; background:var(--panel); }
  .thumb { flex:0 0 200px; aspect-ratio:16/9; background:var(--line); border-radius:4px; object-fit:cover; width:200px; }
  .info { min-width:0; }
  .info h2 { font-size:16px; margin:0 0 4px; }
  .info h2 a { color:var(--fg); text-decoration:none; }
  .info h2 a:hover { color:var(--accent); }
  .desc { color:var(--muted); margin:0 0 6px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  dl { display:grid; grid-template-columns:auto 1fr; gap:2px 10px; margin:0; font-size:13px; }
  dt { color:var(--muted); } dd { margin:0; }
  .badge { font-size:11px; padding:1px 6px; border-radius:10px; border:1px solid var(--line); color:var(--muted); vertical-align:middle; }
  #state { color:var(--muted); padding:20px 0; }
  #state.bad { color:var(--bad); }
  @media (max-width:560px) { .card { flex-direction:column; } .thumb { width:100%; flex-basis:auto; } }
</style>
</head>
<body>
<header>
  <h1>Last 5 presentations uploaded <span style="font-weight:400;color:var(--muted);font-size:13px">(viewable, newest first)</span></h1>
  <a href="/">API tester →</a>
</header>
<div id="state">Loading…</div>
<div id="list"></div>

<script>
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const fmtDate = (d) => d ? new Date(d).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) : '—';
function fmtDuration(ms) {
  if (!ms) return '—';
  const t = Math.round(ms / 1000), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0');
}

(async () => {
  const state = document.getElementById('state');
  try {
    const res = await fetch('/recent.json');
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    if (!data.items.length) {
      state.textContent = 'No presentations visible to this account. A username and password are probably needed in .env — the API key alone only sees public content.';
      return;
    }
    state.remove();
    document.getElementById('list').innerHTML = data.items.map((p) => `
      <article class="card">
        ${p.thumbnail ? `<img class="thumb" src="${esc(p.thumbnail)}" alt="" loading="lazy">` : '<div class="thumb"></div>'}
        <div class="info">
          <h2><a href="${esc(p.watchUrl)}" target="_blank" rel="noopener">${esc(p.title || 'Untitled')}</a>
            ${p.status ? `<span class="badge">${esc(p.status)}</span>` : ''}${p.isLive ? ' <span class="badge">LIVE</span>' : ''}</h2>
          ${p.description ? `<p class="desc">${esc(p.description)}</p>` : ''}
          <dl>
            <dt>Uploaded</dt><dd>${esc(fmtDate(p.created))}</dd>
            <dt>Recorded</dt><dd>${esc(fmtDate(p.recorded))}</dd>
            <dt>Duration</dt><dd>${esc(fmtDuration(p.durationMs))}</dd>
            <dt>Presenter</dt><dd>${esc(p.presenter || '—')}</dd>
            <dt>Owner</dt><dd>${esc(p.owner || '—')}</dd>
            <dt>Folder</dt><dd>${esc(p.folder || '—')}</dd>
            <dt>Views</dt><dd>${esc(p.views ?? '—')}</dd>
          </dl>
        </div>
      </article>`).join('');
  } catch (e) {
    state.className = 'bad';
    state.textContent = 'Could not load presentations: ' + e.message;
  }
})();
</script>
</body>
</html>
