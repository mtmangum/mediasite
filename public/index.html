<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mediasite API Tester</title>
<style>
  :root { --bg:#fff; --fg:#1b1f23; --muted:#667; --line:#d5d9de; --panel:#f5f6f8; --accent:#0b62d6; --ok:#12794a; --bad:#b42318; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171a; --fg:#e6e8ea; --muted:#9aa3ad; --line:#2d333a; --panel:#1c2024; --accent:#6aa6ff; --ok:#4cc38a; --bad:#ff7b72; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; font:14px/1.45 system-ui,sans-serif; background:var(--bg); color:var(--fg); max-width:1000px; margin-inline:auto; }
  h1 { font-size:18px; margin:0 0 12px; }
  fieldset { border:1px solid var(--line); border-radius:6px; margin:0 0 12px; padding:10px 12px; }
  legend { color:var(--muted); padding:0 4px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
  input, select, textarea, button { font:inherit; color:inherit; background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:6px 8px; }
  input { flex:1 1 180px; min-width:0; }
  #path { flex:1 1 300px; font-family:ui-monospace,monospace; }
  button { cursor:pointer; background:var(--accent); color:#fff; border-color:var(--accent); }
  button.secondary { background:var(--panel); color:var(--fg); border-color:var(--line); }
  textarea { width:100%; height:90px; font-family:ui-monospace,monospace; }
  pre { margin:0; padding:10px; background:var(--panel); border:1px solid var(--line); border-radius:4px; overflow:auto; max-height:55vh; white-space:pre-wrap; word-break:break-word; font-size:13px; }
  #meta { margin:8px 0; font-weight:600; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
  .muted { color:var(--muted); font-weight:400; }
</style>
</head>
<body>
<h1>Mediasite API Tester</h1>

<fieldset>
  <legend>Connection <span id="cfgStatus" class="muted"></span></legend>
  <div class="row">
    <input id="baseUrl" placeholder="Base URL">
  </div>
  <div class="row">
    <input id="username" placeholder="Username" autocomplete="off">
    <input id="password" type="password" placeholder="Password" autocomplete="off">
    <input id="apiKey" type="password" placeholder="API key (sfapikey)" autocomplete="off">
    <button id="save" class="secondary">Apply</button>
  </div>
</fieldset>

<fieldset>
  <legend>Request</legend>
  <div class="row" id="presets"></div>
  <div class="row">
    <select id="method"><option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option></select>
    <input id="path" value="/Home">
    <button id="send">Send</button>
  </div>
  <textarea id="body" placeholder="JSON body (POST/PUT/PATCH)" hidden></textarea>
</fieldset>

<div id="meta"></div>
<pre id="out">Response will appear here.</pre>

<script>
const $ = (id) => document.getElementById(id);
const presets = [
  ['Home', '/Home'],
  ['$metadata', '/$metadata'],
  ['Presentations (5)', '/Presentations?$top=5&$select=Id,Title,Status,Duration'],
  ['Folders (5)', '/Folders?$top=5&$select=Id,Name,ParentFolderId'],
  ['Recent presentations', '/Presentations?$top=5&$orderby=CreationDate desc&$select=Id,Title,CreationDate'],
  ['Search "lecture"', "/Presentations?$top=5&$filter=substringof('lecture',Title)&$select=Id,Title"],
  ['Users (5)', '/UserProfiles?$top=5'],
];
for (const [label, p] of presets) {
  const b = document.createElement('button');
  b.className = 'secondary'; b.textContent = label;
  b.onclick = () => { $('method').value = 'GET'; $('path').value = p; toggleBody(); send(); };
  $('presets').append(b);
}

const toggleBody = () => { $('body').hidden = $('method').value === 'GET' || $('method').value === 'DELETE'; };
$('method').onchange = toggleBody;

async function loadConfig(post) {
  const opts = post ? { method: 'POST', body: JSON.stringify({
    baseUrl: $('baseUrl').value.trim(), username: $('username').value.trim(),
    password: $('password').value, apiKey: $('apiKey').value }) } : {};
  const c = await (await fetch('/config', opts)).json();
  $('baseUrl').value = c.baseUrl; $('username').value = c.username;
  $('password').value = ''; $('apiKey').value = '';
  $('password').placeholder = c.hasPassword ? 'Password (set)' : 'Password';
  $('apiKey').placeholder = c.hasApiKey ? 'API key (set)' : 'API key (sfapikey)';
  $('cfgStatus').textContent = c.hasApiKey ? '— API key set' : '— anonymous only';
}
$('save').onclick = () => loadConfig(true);

async function send() {
  $('meta').textContent = 'Sending…'; $('out').textContent = '';
  try {
    const method = $('method').value;
    const r = await (await fetch('/request', { method: 'POST', body: JSON.stringify({
      method, path: $('path').value.trim(),
      body: ['GET', 'DELETE'].includes(method) ? undefined : $('body').value || undefined }) })).json();
    if (r.error) throw new Error(r.error);
    const ok = r.status >= 200 && r.status < 300;
    $('meta').innerHTML = `<span class="${ok ? 'ok' : 'bad'}">${r.status} ${r.statusText}</span> <span class="muted">· ${r.ms} ms · ${r.url}</span>`;
    let text = r.body;
    try { text = JSON.stringify(JSON.parse(r.body), null, 2); } catch {}
    $('out').textContent = text || '(empty body)';
  } catch (e) {
    $('meta').innerHTML = `<span class="bad">Error: ${e.message}</span>`;
  }
}
$('send').onclick = send;
$('path').onkeydown = (e) => { if (e.key === 'Enter') send(); };
loadConfig(false);
</script>
</body>
</html>
